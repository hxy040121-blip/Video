<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0809">
<title>夙与愿</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0809'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23c29a5b' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ff2e7e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/vendor/lenis.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/prologue.css">
<link rel="stylesheet" href="assets/css/screening.css">
<link rel="stylesheet" href="assets/css/mansion.css">
<link rel="stylesheet" href="assets/css/cast.css">
<link rel="stylesheet" href="assets/css/table.css">
<link rel="stylesheet" href="assets/css/identities.css">
<link rel="stylesheet" href="assets/css/cycle.css">
<link rel="stylesheet" href="assets/css/trial.css">
<link rel="stylesheet" href="assets/css/plaque.css">
<link rel="stylesheet" href="assets/css/wish.css">
</head>
<body class="is-locked">

<!-- 全屏层：背景烟雾、颗粒、暗角 -->
<canvas id="bg" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>

<!-- 遮幕 -->
<div id="gate" role="dialog" aria-label="夙与愿">
  <div class="gate-lid gate-lid--top"></div>
  <div class="gate-lid gate-lid--bottom"></div>
  <div class="gate-core">
    <div class="gate-pulse"><i></i></div>
    <div class="gate-time">16:59</div>
    <button class="gate-open" type="button" data-cursor="醒来" disabled>
      <span class="gate-open-label">睁开眼睛</span>
    </button>
    <div class="gate-hint">♪</div>
  </div>
</div>

<!-- 常驻 HUD -->
<header id="hud">
  <a class="hud-mark" href="#prologue" data-cursor="目录" aria-label="目录">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15"/><circle cx="20" cy="20" r="3.2"/></svg>
  </a>
  <div class="hud-clock" aria-live="off">
    <span class="hud-day">第一日</span>
    <span class="hud-time">17:00</span>
  </div>
  <nav class="hud-nav" aria-label="板块"></nav>
  <button class="hud-film" type="button" data-cursor="放映" aria-label="放映">
    <svg viewBox="0 0 28 20" aria-hidden="true"><rect x="1" y="3" width="20" height="14" rx="1"/><path d="M21 8.5 L27 5 L27 15 L21 11.5"/><circle cx="7" cy="10" r="2.4"/><circle cx="15" cy="10" r="2.4"/></svg>
  </button>
  <button class="hud-sound" type="button" data-cursor="声音" aria-label="声音">
    <i></i><i></i><i></i><i></i><i></i>
  </button>
</header>

<div id="cursor" aria-hidden="true">
  <div class="cursor-ring"><span class="cursor-label"></span></div>
  <div class="cursor-dot"></div>
</div>

<div id="overlay" aria-hidden="true"></div>

<main id="world">
  <section id="prologue" class="sec" data-title="醒来"></section>
  <section id="screening" class="sec" data-title="放映"></section>
  <section id="mansion" class="sec" data-title="洋馆"></section>
  <section id="cast" class="sec" data-title="卡池"></section>
  <section id="table" class="sec" data-title="十五席"></section>
  <section id="identities" class="sec" data-title="身份"></section>
  <section id="cycle" class="sec" data-title="受命"></section>
  <section id="trial" class="sec" data-title="庭审"></section>
  <section id="plaque" class="sec" data-title="铜牌"></section>
  <section id="wish" class="sec" data-title="愿望"></section>
</main>

<!-- 第三方库（本地） -->
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/SplitText.min.js"></script>
<script src="assets/vendor/Draggable.min.js"></script>
<script src="assets/vendor/InertiaPlugin.min.js"></script>
<script src="assets/vendor/CustomEase.min.js"></script>
<script src="assets/vendor/ScrambleTextPlugin.min.js"></script>
<script src="assets/vendor/Flip.min.js"></script>
<script src="assets/vendor/Observer.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>

<!-- 数据 -->
<script src="assets/data/world.js"></script>
<script src="assets/data/characters.js"></script>
<script src="assets/data/lines/a.js"></script>
<script src="assets/data/lines/b.js"></script>
<script src="assets/data/lines/c.js"></script>
<script src="assets/data/lines/d.js"></script>
<script src="assets/data/lines/e.js"></script>
<script src="assets/data/lore.js"></script>
<script src="assets/data/portraits.js"></script>
<script src="assets/data/portrait-images.js"></script>
<script src="assets/data/sigils.js"></script>
<script src="assets/audio/tracks.js"></script>

<!-- 核心 -->
<script src="assets/js/core/app.js"></script>
<script src="assets/js/core/audio.js"></script>
<script src="assets/js/core/bg.js"></script>
<script src="assets/js/core/cursor.js"></script>
<script src="assets/js/core/scroll.js"></script>
<script src="assets/js/core/hud.js"></script>
<script src="assets/js/core/gate.js"></script>

<!-- 板块 -->
<script src="assets/js/sections/prologue.js"></script>
<script src="assets/js/sections/screening.js"></script>
<script src="assets/js/sections/mansion.js"></script>
<script src="assets/js/sections/cast.js"></script>
<script src="assets/js/sections/table.js"></script>
<script src="assets/js/sections/identities.js"></script>
<script src="assets/js/sections/trial-engine.js"></script>
<script src="assets/js/sections/cycle.js"></script>
<script src="assets/js/sections/trial.js"></script>
<script src="assets/js/sections/plaque.js"></script>
<script src="assets/js/sections/wish.js"></script>

<script src="assets/js/main.js"></script>
</body>
</html>
